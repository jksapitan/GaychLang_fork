name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build jar
        run: ./build.sh
      - name: Smoke test
        run: |
          java -jar dist/GaychLang.jar examples/hello.gaych
          java -jar dist/GaychLang.jar examples/countdown.gaych
      - uses: actions/upload-artifact@v4
        with:
          name: GaychLang
          path: dist/GaychLang.jar
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GaychLang.jar
